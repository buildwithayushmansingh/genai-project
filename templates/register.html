<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | EnergyAI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='register.css') }}">
</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="background">

        <div class="grid"></div>

        <div class="glow glow-blue"></div>
        <div class="glow glow-purple"></div>

        <div class="energy-line line-one"></div>
        <div class="energy-line line-two"></div>

    </div>


    <!-- ================= REGISTER CARD ================= -->

    <div class="register-wrapper">

        <div class="register-card">

            <!-- ================= BRANDING ================= -->

            <div class="brand">

                <div class="brand-logo">
                    <span class="logo-a">A</span>
                    <span class="logo-s">S</span>
                    <span class="bolt">⚡</span>
                </div>

                <h3>Ayushman Singh</h3>

                <div class="presents">
                    <span></span>
                    PRESENTS
                    <span></span>
                </div>

                <h1>
                    <span class="energy-icon">⚡</span>
                    ENERGY<span>AI</span>
                </h1>

                <p class="brand-tagline">
                    Smart Energy. Smarter Future.
                </p>

            </div>


            <!-- ================= TITLE ================= -->

            <div class="register-heading">

                <h2>CREATE ACCOUNT</h2>

                <p>
                    Join the future of intelligent energy management
                </p>

            </div>


            <!-- ================= REGISTER FORM ================= -->

            <form action="/register" method="POST" class="register-form">

                <!-- Username -->

                <div class="input-group">

                    <label for="username">
                        <span class="label-icon">♙</span>
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">♙</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        <span class="label-icon">✉</span>
                        Email
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        <span class="label-icon">🔒</span>
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirm_password">
                        <span class="label-icon">🔐</span>
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔐</span>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirm_password', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input type="checkbox" required>

                        <span class="custom-check"></span>

                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>

                    </label>

                </div>


                <!-- Register Button -->

                <button type="submit" class="register-btn">

                    <span>CREATE ACCOUNT</span>

                    <span class="arrow">→</span>

                </button>

            </form>


            <!-- ================= DIVIDER ================= -->

            <div class="divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <!-- ================= LOGIN ================= -->

            <div class="login-link">

                <span>Already have an account?</span>

                <a href="{{ url_for('login') }}">
                    Login
                    <span>→</span>
                </a>

            </div>


        </div>


        <!-- ================= FOOTER ================= -->

        <div class="register-footer">

            <div class="footer-brand">

                <div class="small-logo">
                    AS
                </div>

                <div class="footer-line"></div>

                <strong>Ayushman Singh</strong>

                <div class="footer-line"></div>

                <span>
                    DEVELOPER • INNOVATOR • PROBLEM SOLVER
                </span>

            </div>

            <p>
                © 2026 Ayushman Singh &nbsp;|&nbsp; All Rights Reserved
            </p>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "🙈";

            } else {

                input.type = "password";
                button.textContent = "👁";

            }

        }

    </script>

</body>

</html>
