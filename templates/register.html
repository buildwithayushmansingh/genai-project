
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | EnergyAI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='register.css') }}">

</head>

<body>

    <div class="register-container">

        <div class="logo">
            ⚡ <span>Energy</span>AI
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Start optimizing your energy with EnergyAI
        </p>


        <form action="/register" method="POST">


            <!-- ================= USERNAME ================= -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- ================= EMAIL ================= -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- ================= PASSWORD ================= -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- ================= CONFIRM PASSWORD ================= -->

            <div class="input-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirm_password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- ================= REGISTER BUTTON ================= -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <!-- ================= LOGIN LINK ================= -->

        <div class="login-link">

            Already have an account?

            <a href="/">
                Login
            </a>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
